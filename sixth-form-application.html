<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sixth Form Application — York Castle High School</title>
  <meta name="description" content="Apply for the YCHS Sixth Form Programme. Two-year CAPE programme for qualifying students." />
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" href="images/webclip.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-X57S1L85ZP"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-X57S1L85ZP');</script>
  <style>
    :root {
      --primary:      #1a1410;
      --primary-deep: #000000;
      --primary-soft: #ece8e0;
      --gold:         #c9a227;
      --gold-soft:    #fbf4d8;
      --ink:          #1a1410;
      --ink-2:        #4a3f37;
      --ink-3:        #7a6e62;
      --line:         #e8e0d4;
      --line-2:       #d8cdbb;
      --cream:        #faf6ee;
      --cream-2:      #f3ecdd;
      --paper:        #ffffff;
      --green:        #2f7a4d;
      --green-soft:   #e3f1e7;
      --amber:        #b8770b;
      --amber-soft:   #fbeed3;
      --rose:         #b03a3a;
      --rose-soft:    #f5dede;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #efe9dc;
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ─── Constants ──────────────────────────────────────────────── */
const API_BASE   = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
const LOGO       = 'images/logo-badge.webp';
const STORAGE_KEY = 'ychs_sf_draft_v2';

const PARISHES = [

  'St. James','St. Mary','St. Thomas','Trelawny','Westmoreland',
];

const CSEC_GRADES = ['1','2','3','4','5','6'];

const COMMON_SUBJECTS = [
  'English A','English B','Mathematics','Principles of Accounts',
  'Principles of Business','Human & Social Biology','Biology','Chemistry',
  'Physics','Agricultural Science','Geography','History','Social Studies',
  'Information Technology','Office Administration','Visual Arts','Music',
  'Physical Education','Spanish','French','Religious Education','Economics',
  'Technical Drawing','Food & Nutrition','Home Economics',
];

const PROGRAMMES = [
  {
    id: 'natural-sciences',
    name: 'Natural Sciences',
    units: ['Biology Unit 1 & 2','Chemistry Unit 1 & 2','Physics Unit 1 & 2'],
    desc: 'Prepare for careers in medicine, nursing, engineering and research.',

    seats: 32,
  },
  {

    units: ['Entrepreneurship Unit 1 & 2','Principles of Business Unit 1 & 2','Accounting Unit 1 & 2'],
    desc: 'Build business acumen and launch your own ventures.',

    seats: 18,
  },
  {
    id: 'ict',
    name: 'ICT',
    units: ['Computer Science Unit 1 & 2','Information Technology Unit 1 & 2','Digital Media'],
    desc: 'Develop skills in programming, networking and digital systems.',
    recommended: ['Information Technology','Mathematics','Physics'],
    seats: 20,
  },
  {
    id: 'law',
    name: 'Law',
    units: ['Law Unit 1 & 2','Sociology Unit 1 & 2','Communication Studies'],
    desc: 'Foundation for legal studies, social justice and public service.',
    recommended: ['History','Social Studies','English A','English B'],
    seats: 14,
  },
  {
    id: 'industrial-tech',
    name: 'Industrial Technology',
    units: ['Industrial Technology (Building) Unit 1 & 2','Technical Drawing','Physics Unit 1'],
    desc: 'Hands-on technical training in construction and engineering.',
    recommended: ['Technical Drawing','Physics','Mathematics'],
    seats: 16,
  },
  {
    id: 'tourism',
    name: 'Tourism',
    units: ['Tourism Unit 1 & 2','Food & Beverage Service','Hospitality Management'],
    desc: 'Explore Jamaica\'s leading industry: tourism and hospitality.',
    recommended: ['Food & Nutrition','Office Administration','English A'],
    seats: 14,
  },
  {
    id: 'visual-communication',
    name: 'Visual Communication',
    units: ['Visual Arts Unit 1 & 2','Communication Studies Unit 1 & 2','Art & Design'],
    desc: 'Creative arts, design thinking and multimedia production.',
    recommended: ['Visual Arts','English A','Information Technology'],
    seats: 10,
  },
  {
    id: 'sociology',
    name: 'Sociology',
    units: ['Sociology Unit 1 & 2','Communication Studies Unit 1 & 2','Caribbean Studies'],
    desc: 'Study society, culture and human behaviour in the Caribbean context.',
    recommended: ['Social Studies','History','English A'],
    seats: 12,
  },
];

const DRAFT_DEFAULTS = {
  firstName:'', lastName:'', middleName:'', email:'', phone:'', dob:'',
  gender:'', religion:'', nationality:'Jamaican', yearsOfResidence:'',
  address:'', parish:'',
  guardianFirstName:'', guardianLastName:'', guardianRelationship:'',
  guardianAddress:'', guardianTown:'', guardianParish:'',
  guardianWorkPhone:'', guardianHomePhone:'', guardianCellPhone:'',
  previousSchool:'', positionsHeld:'',
  csecResults:[{ subject:'', grade:'' }],
  programmeId:'', secondChoiceId:'',
  refName1:'', refPhone1:'', refEmail1:'',
  refName2:'', refPhone2:'', refEmail2:'',
  careerGoals:'', strengthsWeaknesses:'', reasonForAttending:'',
  docs:{ id:false, csec:false, photo:false },
};

/* ─── Persistence ────────────────────────────────────────────── */
function loadDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return saved ? { ...DRAFT_DEFAULTS, ...saved } : DRAFT_DEFAULTS;
  }
  catch { return DRAFT_DEFAULTS; }
}
function saveDraft(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
}

/* ─── Icons ──────────────────────────────────────────────────── */
function Icon({ name, size = 20, color = 'currentColor' }) {
  const s = { width: size, height: size, display: 'block', flexShrink: 0, color };
  const paths = {
    'arrow-left':  <><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></>,
    'arrow-right': <><path d="M5 12h14"/><polyline points="12 5 19 12 12 19"/></>,
    'check':       <polyline points="20 6 9 17 4 12"/>,
    'check-circle':<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
    'clock':       <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
    'user':        <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    'doc':         <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>,
    'upload':      <><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>,
    'calendar':    <><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
    'school':      <><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>,
    'book':        <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></>,
    'beaker':      <><path d="M9 3h6l-1 9H10L9 3z"/><path d="M7.5 12S5 14 5 17a7 7 0 0 0 14 0c0-3-2.5-5-2.5-5"/></>,
    'star':        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
    'info':        <><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>,
    'alert':       <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    'plus':        <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    'trash':       <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>,
    'sparkle':     <><path d="M12 3L13.5 8.5H19L14.5 11.5L16 17L12 14L8 17L9.5 11.5L5 8.5H10.5L12 3Z"/></>,
    'send':        <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
  };
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" style={s}>
      {paths[name] || null}
    </svg>
  );
}

/* ─── Responsive hook ───────────────────────────────────────── */
function useIsDesktop() {
  const [v, setV] = useState(() => window.innerWidth >= 768);
  useEffect(() => {
    const h = () => setV(window.innerWidth >= 768);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return v;
}

/* ─── Small UI primitives ────────────────────────────────────── */
function Pill({ tone = 'neutral', children }) {
  const tones = {
    neutral: { bg:'#eee6d6', fg:'var(--ink-2)' },
    primary: { bg:'var(--primary-soft)', fg:'var(--primary)' },
    gold:    { bg:'var(--gold-soft)', fg:'#7a5a05' },
    green:   { bg:'var(--green-soft)', fg:'var(--green)' },
    amber:   { bg:'var(--amber-soft)', fg:'var(--amber)' },
    rose:    { bg:'var(--rose-soft)', fg:'var(--rose)' },
  }[tone] || { bg:'#eee', fg:'#333' };
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:5,
      padding:'4px 10px', borderRadius:999,
      background:tones.bg, color:tones.fg,
      font:'600 11px/1 Inter, sans-serif', letterSpacing:'0.04em',
    }}>{children}</span>
  );
}

function Progress({ value, steps }) {
  return (
    <div style={{ display:'flex', gap:4 }}>
      {Array.from({ length: steps }).map((_, i) => (
        <div key={i} style={{
          flex: 1, height: 4, borderRadius: 4,
          background: i < value ? 'var(--primary)' : 'var(--line)',
          transition: 'background .2s',
        }}/>
      ))}
    </div>
  );
}

/* ─── Layout wrapper ─────────────────────────────────────────── */
function Shell({ children }) {
  const isDesktop = useIsDesktop();
  return (
    <div style={{
      width: '100%',
      maxWidth: isDesktop ? 'none' : 520,
      margin: isDesktop ? 0 : '0 auto',
      minHeight: '100vh', display: 'flex', flexDirection: 'column',
      background: 'var(--cream)',
    }}>
      {children}
    </div>
  );
}

function TopBar({ step, totalSteps, onBack, title }) {
  const isDesktop = useIsDesktop();
  const showProgress = step != null && !isDesktop;
  return (
    <div style={{
      position: 'sticky', top: 0, zIndex: 10,
      background: 'rgba(250,246,238,0.92)',
      backdropFilter: 'blur(12px)',
      borderBottom: '1px solid var(--line)',
      padding: '14px 16px 12px',
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom: showProgress ? 10 : 0 }}>
        {onBack ? (
          <button onClick={onBack} style={{
            width:36, height:36, borderRadius:10, border:'1px solid var(--line)',
            background:'var(--paper)', cursor:'pointer', display:'flex',
            alignItems:'center', justifyContent:'center', flexShrink:0,
          }}>
            <Icon name="arrow-left" size={18}/>
          </button>
        ) : (
          <img src={LOGO} alt="YCHS" style={{ width:36, height:36, borderRadius:8, objectFit:'cover', flexShrink:0 }} />
        )}
        <div style={{ flex:1 }}>
          <div style={{ font:'600 15px/1.2 Fraunces, serif' }}>{title}</div>
          {step != null && !isDesktop && <div style={{ font:'400 12px/1 Inter', color:'var(--ink-3)', marginTop:3 }}>Step {step} of {totalSteps}</div>}
        </div>
      </div>
      {showProgress && <Progress value={step} steps={totalSteps}/>}
    </div>
  );
}

/* ─── Sidebar (desktop only) ─────────────────────────────────── */
const FORM_STEPS = [
  { id:'personal',  label:'Personal Info'        },
  { id:'guardian',  label:'Guardian Information' },
  { id:'academic',  label:'Academic Background'  },
  { id:'csec',      label:'CSEC Results'         },
  { id:'subjects',  label:'Programme Choice'     },
  { id:'refs',      label:'References'           },
  { id:'statement', label:'Personal Statement'   },
  { id:'docs',      label:'Documents'            },
  { id:'review',    label:'Review & Submit'      },
];

function Sidebar({ screen }) {
  const currentIdx = FORM_STEPS.findIndex(s => s.id === screen);
  return (
    <div style={{
      width: 280, flexShrink: 0,
      background: 'var(--primary)', color: '#fff',
      position: 'sticky', top: 0, height: '100vh',
      display: 'flex', flexDirection: 'column',
      padding: '36px 24px', overflow: 'hidden',
    }}>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:36 }}>
        <img src={LOGO} alt="YCHS" style={{ width:42, height:42, borderRadius:10, objectFit:'cover' }}/>
        <div>
          <div style={{ font:'700 14px/1.2 Fraunces, serif' }}>York Castle</div>
          <div style={{ font:'400 11px/1 Inter', opacity:0.5, marginTop:3 }}>High School</div>
        </div>
      </div>

      <div style={{ font:'600 19px/1.3 Fraunces, serif', marginBottom:4 }}>Sixth Form Application</div>
      <div style={{ font:'400 12px/1 Inter', opacity:0.5, marginBottom:36 }}>Academic Year 2026–2027</div>

      <div style={{ display:'flex', flexDirection:'column', gap:2 }}>
        {FORM_STEPS.map((s, i) => {
          const done   = i < currentIdx;
          const active = i === currentIdx;
          return (
            <div key={s.id} style={{
              display:'flex', alignItems:'center', gap:12,
              padding:'10px 12px', borderRadius:10,
              background: active ? 'rgba(255,255,255,0.12)' : 'transparent',
              opacity: done ? 0.75 : active ? 1 : 0.35,
              transition: 'opacity .2s',
            }}>
              <div style={{
                width:26, height:26, borderRadius:'50%', flexShrink:0,
                background: done ? 'var(--gold)' : active ? '#fff' : 'transparent',
                border: (done || active) ? 'none' : '1px solid rgba(255,255,255,0.25)',
                display:'flex', alignItems:'center', justifyContent:'center',
              }}>
                {done
                  ? <Icon name="check" size={13} color="var(--ink)"/>
                  : <span style={{ font:'600 11px/1 Inter', color: active ? 'var(--primary)' : 'rgba(255,255,255,0.4)' }}>{i+1}</span>
                }
              </div>
              <span style={{ font:`${active ? '600' : '400'} 13px/1 Inter` }}>{s.label}</span>
            </div>
          );
        })}
      </div>

      <div style={{ marginTop:'auto', paddingTop:20, borderTop:'1px solid rgba(255,255,255,0.1)' }}>
        <div style={{ font:'400 11px/1.7 Inter', opacity:0.4 }}>
          Questions?<br/>
          +1 876 975-2217<br/>
          yorkcastle.high.san@moey.gov.jm
        </div>
      </div>
    </div>
  );
}

/* ─── App layout (two-column on desktop for form screens) ────── */
function AppLayout({ screen, children }) {
  const isDesktop = useIsDesktop();
  const isFormStep = FORM_STEPS.some(s => s.id === screen);

  if (!isDesktop || !isFormStep) {
    return (
      <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', width:'100%', background:'#efe9dc' }}>
        {children}
      </div>
    );
  }

  return (
    <div style={{ display:'flex', minHeight:'100vh', width:'100%' }}>
      <Sidebar screen={screen}/>
      <div style={{
        flex:1, background:'#efe9dc',
        display:'flex', justifyContent:'center',
        overflowY:'auto',
      }}>
        <div style={{ width:'100%', background:'var(--cream)', minHeight:'100vh' }}>
          {children}
        </div>
      </div>
    </div>
  );
}

function Btn({ children, onClick, variant='primary', block, disabled, type='button', icon }) {
  const styles = {
    primary: { background:'var(--primary)', color:'#fff' },
    ghost:   { background:'transparent', color:'var(--ink)', border:'1px solid var(--line-2)' },
    gold:    { background:'var(--gold)', color:'var(--ink)' },
    danger:  { background:'var(--rose-soft)', color:'var(--rose)', border:'1px solid #f0c8c8' },
  }[variant] || {};
  return (
    <button type={type} onClick={onClick} disabled={disabled} style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8,
      padding:'14px 20px', borderRadius:12, border:'none', cursor: disabled ? 'not-allowed' : 'pointer',
      font:'600 15px/1 Inter, sans-serif',
      width: block ? '100%' : undefined,
      opacity: disabled ? 0.5 : 1,
      transition:'transform .08s, opacity .1s',
      ...styles,
    }}
    onMouseDown={e => { if (!disabled) e.currentTarget.style.transform='scale(0.98)'; }}
    onMouseUp={e => { e.currentTarget.style.transform=''; }}
    >
      {icon && <Icon name={icon} size={18}/>}
      {children}
    </button>
  );
}

function FieldGroup({ label, error, children }) {
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      {label && <label style={{ font:'600 11px/1 Inter', letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--ink-3)' }}>{label}</label>}
      {children}
      {error && <div style={{ font:'500 12px/1.3 Inter', color:'var(--rose)', display:'flex', gap:5, alignItems:'center' }}><Icon name="alert" size={13} color="var(--rose)"/>{error}</div>}
    </div>
  );
}

function Input({ value, onChange, placeholder, type='text', ...rest }) {
  return (
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      style={{
        display:'block', width:'100%', background:'var(--paper)',
        border:'1px solid var(--line)', borderRadius:12,
        padding:'13px 14px', font:'500 15px/1.3 Inter, sans-serif',
        color:'var(--ink)', outline:'none', transition:'border-color .12s, box-shadow .12s',
      }}
      onFocus={e => { e.target.style.borderColor='var(--primary)'; e.target.style.boxShadow='0 0 0 3px rgba(26,20,16,0.1)'; }}
      onBlur={e => { e.target.style.borderColor='var(--line)'; e.target.style.boxShadow='none'; }}
      {...rest}
    />
  );
}

function Select({ value, onChange, children, ...rest }) {
  return (
    <select value={value} onChange={onChange}
      style={{
        display:'block', width:'100%', background:'var(--paper)',
        border:'1px solid var(--line)', borderRadius:12,
        padding:'13px 14px', font:'500 15px/1.3 Inter, sans-serif',
        color: value ? 'var(--ink)' : 'var(--ink-3)', outline:'none',
        appearance:'none', cursor:'pointer',
        transition:'border-color .12s, box-shadow .12s',
      }}
      onFocus={e => { e.target.style.borderColor='var(--primary)'; e.target.style.boxShadow='0 0 0 3px rgba(26,20,16,0.1)'; }}
      onBlur={e => { e.target.style.borderColor='var(--line)'; e.target.style.boxShadow='none'; }}
      {...rest}
    >
      {children}
    </select>
  );
}

function Card({ children, style }) {
  return (
    <div style={{
      background:'var(--paper)', border:'1px solid var(--line)',
      borderRadius:16, ...style,
    }}>
      {children}
    </div>
  );
}

function InfoBox({ tone='neutral', icon, children }) {
  const tones = {
    neutral: { bg:'var(--primary-soft)', fg:'var(--ink-2)', border:'var(--line)' },
    gold:    { bg:'var(--gold-soft)', fg:'#7a5a05', border:'#e8d48a' },
    green:   { bg:'var(--green-soft)', fg:'var(--green)', border:'#b8dfc6' },
    amber:   { bg:'var(--amber-soft)', fg:'var(--amber)', border:'#f0d09a' },
    rose:    { bg:'var(--rose-soft)', fg:'var(--rose)', border:'#f0c8c8' },
  }[tone];
  return (
    <div style={{
      background: tones.bg, border:`1px solid ${tones.border}`, borderRadius:12,
      padding:'12px 14px', color:tones.fg,
      display:'flex', gap:10, alignItems:'flex-start',
      font:'500 13px/1.5 Inter, sans-serif',
    }}>
      {icon && <Icon name={icon} size={16} color={tones.fg}/>}
      <div>{children}</div>
    </div>
  );
}

/* ─── SCREEN 1: Landing ──────────────────────────────────────── */
function S_Landing({ onStart, draft }) {
  const isDesktop = useIsDesktop();
  const requirements = [
    'Minimum 5 CSEC passes including English A and Mathematics',
    'Grades 1–3 in subjects related to your chosen CAPE programme',
    'Satisfactory school report from your current/previous school',
  ];
  const timeline = [

/* ─── SCREEN 6: Programme Choice ─────────────────────────────── */
function S_Subjects({ data, onChange, onNext, onBack, errors }) {
  const isDesktop = useIsDesktop();
  const taken = data.csecResults.map(r => r.subject);

  function matchScore(prog) {
    return prog.recommended.filter(s => taken.includes(s)).length;
  }

  const sorted = [...PROGRAMMES].sort((a, b) => matchScore(b) - matchScore(a));
  const topMatch = sorted[0];
  const p = isDesktop ? '36px 48px 48px' : '20px 20px 32px';

  return (
    <Shell>
      <TopBar title="Programme Choice" step={5} totalSteps={9} onBack={onBack}/>
      <div style={{ padding:p, display:'flex', flexDirection:'column', gap:isDesktop ? 24 : 18 }}>

          <div style={{ font:'400 13px/1.5 Inter', color:'var(--ink-3)' }}>Select your first and second choice. Click a card to choose.</div>
        </div>

        {taken.length >= 3 && (

/* ─── Validation ─────────────────────────────────────────────── */
function validate(screen, data) {
  const errs = {};
  if (screen === 'personal') {
    if (!data.firstName.trim()) errs.firstName = 'Required';
    if (!data.lastName.trim())  errs.lastName  = 'Required';
    if (!data.email.trim() || !/\S+@\S+\.\S+/.test(data.email)) errs.email = 'Valid email required';
    if (!data.phone.trim()) errs.phone = 'Required';
    if (!data.dob)          errs.dob   = 'Required';
    if (!data.address.trim()) errs.address = 'Required';
    if (!data.parish)       errs.parish = 'Select a parish';
  }
  if (screen === 'academic') {
    if (!data.previousSchool.trim()) errs.previousSchool = 'Required';
  }
  if (screen === 'csec') {
    const valid = data.csecResults.filter(r => r.subject && r.grade);
    if (valid.length < 1) errs.csec = 'Add at least one CSEC result';
  }
  if (screen === 'subjects') {
    if (!data.programmeId) errs.programmeId = 'Select a first-choice programme';
  }
  if (screen === 'refs') {
    if (!data.refName1.trim()) errs.refName1 = 'Required';
    if (!data.refName2.trim()) errs.refName2 = 'Required';
  }
  return errs;
}

/* ─── App ────────────────────────────────────────────────────── */
const SCREENS = ['landing','overview','personal','academic','csec','subjects','refs','docs','review','status'];

function App() {
  const [screen, setScreen]         = useState('landing');
  const [data, setData]             = useState(loadDraft);
  const [errors, setErrors]         = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);

  useEffect(() => { saveDraft(data); }, [data]);

  const change = useCallback((field, value) => {
    setData(d => ({ ...d, [field]: value }));
    setErrors(e => { const n={...e}; delete n[field]; return n; });
  }, []);

  function go(target) {
    setErrors({});
    setScreen(target);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function tryNext(current, next) {
    const errs = validate(current, data);
    if (Object.keys(errs).length) { setErrors(errs); return; }
    go(next);
  }

  async function handleSubmit() {
    const errs = validate('review', data);
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setSubmitting(true);
    setSubmitError(null);
    try {
      const payload = {
        firstName:      data.firstName,
        lastName:       data.lastName,
        middleName:     data.middleName || undefined,
        email:          data.email,
        phone:          data.phone.replace(/\s+/g, '').replace(/[^\d+\-()]/g, ''),
        dateOfBirth:    data.dob,
        address:          data.address + (data.parish ? `, ${data.parish}` : ''),
        gender:           data.gender || undefined,
        religion:         data.religion || undefined,
        nationality:      data.nationality || undefined,
        yearsOfResidence: data.yearsOfResidence ? parseInt(data.yearsOfResidence) : undefined,
        previousSchool:   data.previousSchool,
        positionsHeld:    data.positionsHeld || undefined,
        guardianInfo: {
          firstName:    data.guardianFirstName,
          lastName:     data.guardianLastName,
          relationship: data.guardianRelationship,
          address:      data.guardianAddress,
          town:         data.guardianTown,
          parish:       data.guardianParish,
          workPhone:    data.guardianWorkPhone,
          homePhone:    data.guardianHomePhone,
          cellPhone:    data.guardianCellPhone,
        },
        careerGoals:        data.careerGoals || undefined,
        strengthsWeaknesses: data.strengthsWeaknesses || undefined,
        reasonForAttending: data.reasonForAttending || undefined,
        csecResults:    data.csecResults.filter(r => r.subject && r.grade),
        subjectChoices: {
          firstChoice:  data.programmeId,
          secondChoice: data.secondChoiceId || undefined,
        },
      };
      console.log('[YCHS submit payload]', JSON.stringify(payload, null, 2));
      const res = await fetch(`${API_BASE}/sixth-form`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const detail = body.details?.map(e => e.msg).join(', ') || body.error || body.message || `Server error ${res.status}`;
        throw new Error(detail);
      }
      localStorage.removeItem(STORAGE_KEY);
      go('status');
    } catch (err) {
      setSubmitError(err.message || 'Submission failed. Please try again.');
    } finally {
      setSubmitting(false);
    }
  }

  const csecProps = {
    onChangeRow: (i, field, value) => {
      const rows = [...data.csecResults];
      rows[i] = { ...rows[i], [field]: value };
      change('csecResults', rows);
    },
    onAddRow: () => change('csecResults', [...data.csecResults, { subject:'', grade:'' }]),
    onRemoveRow: (i) => change('csecResults', data.csecResults.filter((_, idx) => idx !== i)),
  };

  function renderScreen() {
    switch (screen) {
      case 'landing':   return <S_Landing onStart={() => go('overview')} draft={data}/>;
      case 'overview':   return <S_Overview onNext={() => go('personal')} onBack={() => go('landing')}/>;
      case 'personal':   return <S_Personal data={data} onChange={change} onNext={() => tryNext('personal','guardian')} onBack={() => go('overview')} errors={errors}/>;
      case 'guardian':   return <S_Guardian data={data} onChange={change} onNext={() => go('academic')} onBack={() => go('personal')} errors={errors}/>;
      case 'academic':   return <S_Academic data={data} onChange={change} onNext={() => tryNext('academic','csec')} onBack={() => go('guardian')} errors={errors}/>;
      case 'csec':       return <S_CXC data={data} {...csecProps} onNext={() => tryNext('csec','subjects')} onBack={() => go('academic')} errors={errors}/>;
      case 'subjects':   return <S_Subjects data={data} onChange={change} onNext={() => tryNext('subjects','refs')} onBack={() => go('csec')} errors={errors}/>;
      case 'refs':       return <S_Refs data={data} onChange={change} onNext={() => tryNext('refs','statement')} onBack={() => go('subjects')} errors={errors}/>;
      case 'statement':  return <S_Statement data={data} onChange={change} onNext={() => go('docs')} onBack={() => go('refs')}/>;
      case 'docs':       return <S_Docs data={data} onChange={change} onNext={() => go('review')} onBack={() => go('statement')}/>;
      case 'review':     return <S_Review data={data} onSubmit={handleSubmit} onBack={() => go('docs')} submitting={submitting} submitError={submitError}/>;
      case 'status':    return <S_Status data={data}/>;
      default:          return null;
    }
  }

  return <AppLayout screen={screen}>{renderScreen()}</AppLayout>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
