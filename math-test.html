<body class="body-4">
  <div>
    <div class="w-container">
      <div>
        <h1 id="text">Heading</h1>
      </div>
    </div>
  </div>
  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=5ff7c2ade6e719f4bf214be0" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  
  
  <script>
const questions = [];
const answers = [];
for (let i = 0; i < 20; i++) {
  // Generate a random number between 1 and 20 for the left operand
  const left = Math.floor(Math.random() * 20) + 1;
  // Generate a random number between 1 and 20 for the right operand
  const right = Math.floor(Math.random() * 20) + 1;
  // Generate a random operator: 0 for addition, 1 for subtraction, 2 for multiplication, and 3 for division
  const operator = Math.floor(Math.random() * 4);
  // Create the question based on the operator
  let question;
  let correctAnswer;
  switch (operator) {
    case 0:
      question = `What is ${left} + ${right}?`;
      correctAnswer = left + right;
      break;
    case 1:
      question = `What is ${left} - ${right}?`;
      correctAnswer = left - right;
      break;
    case 2:
      question = `What is ${left} * ${right}?`;
      correctAnswer = left * right;
      break;
    case 3:
      question = `What is ${left} / ${right}?`;
      correctAnswer = left / right;
      break;
  }
  // Add the question and correct answer to the respective arrays
  questions.push(question);
  answers.push(correctAnswer);
  // Ask the user for the answer
  const userAnswer = prompt(question);
  // Check if the answer is correct
  if (userAnswer == correctAnswer) {
    alert("Correct!");
  } else {
    alert("Incorrect. The correct answer is: " + correctAnswer);
  }
}
// Display all the questions and answers at the end
for (let i = 0; i < questions.length; i++) {
  document.write(questions[i] + " " + answers[i]);
}
</script>
