<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YCHS · Sixth Form Application Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon: #7a1f2b;
    --maroon-deep: #5d1620;
    --maroon-soft: #f6ecec;
    --gold: #c9a227;
    --gold-soft: #fbf4d8;
    --ink: #1a1410;
    --ink-2: #4a3f37;
    --ink-3: #7a6e62;
    --line: #e8e0d4;
    --line-2: #d8cdbb;
    --cream: #faf6ee;
    --cream-2: #f3ecdd;
    --paper: #ffffff;
    --green: #2f7a4d;
    --green-soft: #e3f1e7;
    --amber: #b8770b;
    --amber-soft: #fbeed3;
    --rose: #b03a3a;
    --rose-soft: #f5dede;
    --blue: #2c5282;
    --blue-soft: #e3ecf6;
  }
  html, body {
    margin: 0; padding: 0;
    background: #efe9dc;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  /* Phone frame screen surface helpers */
  .yc-screen {
    width: 100%; height: 100%;
    background: var(--cream);
    overflow-y: auto; overflow-x: hidden;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    position: relative;
  }
  .yc-screen::-webkit-scrollbar { display: none; }
  .yc-screen { scrollbar-width: none; }
  .serif { font-family: 'Fraunces', 'PT Serif', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }
  .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 18px; border-radius: 12px;
    font: 600 15px/1 'Inter', sans-serif;
    border: none; cursor: pointer; transition: transform .08s, background .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--maroon); color: #fff; }
  .btn-primary:hover { background: var(--maroon-deep); }
  .btn-ghost   { background: transparent; color: var(--maroon); border: 1px solid var(--line-2); }
  .btn-gold    { background: var(--gold); color: var(--ink); }
  .btn-block   { width: 100%; }
  /* Inputs */
  .field {
    display: block; width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px;
    font: 500 15px/1.3 'Inter', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .field:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(122,31,43,0.12); }
  .field::placeholder { color: var(--ink-3); font-weight: 400; }
  textarea.field { resize: none; }
  .label { display: block; font: 600 11px/1 'Inter', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  /* Card */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  /* Chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font: 600 11px/1 'Inter', sans-serif; letter-spacing: 0.04em;
  }
  /* placeholder image */
  .ph-img {
    background:
      repeating-linear-gradient(135deg, rgba(122,31,43,0.08) 0 8px, rgba(122,31,43,0.04) 8px 16px),
      var(--maroon-soft);
    color: var(--maroon);
    font: 500 11px/1 'JetBrains Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  /* Status bar dots */
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  /* Hide scrollbars on focus overlay scaler */
  body::-webkit-scrollbar { display: none; }
  body { scrollbar-width: none; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens-student.jsx"></script>
<script type="text/babel" src="screens-admin.jsx"></script>

</body>
</html>
